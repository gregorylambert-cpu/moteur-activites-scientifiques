<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moteur d'activités scientifiques — V0</title>
<style>
:root { --ink:#17202a; --muted:#667085; --line:#e4e7ec; --bg:#f7f8fa; --card:#fff; --accent:#1769aa; }
* { box-sizing:border-box; }
body { margin:0; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
header { background:#fff; border-bottom:1px solid var(--line); padding:28px max(20px,calc((100vw - 1180px)/2)); }
h1 { margin:0 0 7px; font-size:28px; }
.subtitle { color:var(--muted); }
main { max-width:1180px; margin:24px auto; padding:0 20px; }
.search { display:flex; gap:10px; margin-bottom:18px; }
input, select { border:1px solid #cfd4dc; border-radius:9px; padding:11px 12px; font-size:15px; background:#fff; }
#q { flex:1; min-width:0; }
button { border:0; border-radius:9px; padding:11px 16px; cursor:pointer; background:var(--accent); color:white; font-weight:600; }
.layout { display:grid; grid-template-columns:260px 1fr; gap:20px; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
.filters label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
.filters input, .filters select { width:100%; }
.results-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; color:var(--muted); }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:17px; margin-bottom:12px; }
.card h2 { font-size:18px; margin:0 0 7px; }
.meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.tag { background:#f0f4f8; border-radius:999px; padding:4px 8px; font-size:12px; }
.detail { font-size:14px; margin-top:9px; }
.detail strong { color:#344054; }
a { color:var(--accent); text-decoration:none; font-weight:600; }
a:hover { text-decoration:underline; }
.empty { text-align:center; padding:50px 20px; color:var(--muted); }
.small { font-size:12px; color:var(--muted); margin-top:8px; }
@media(max-width:800px) { .layout{grid-template-columns:1fr} .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px} .filters label{margin-top:5px} .search{flex-direction:column} }
</style>
</head>
<body>
<header>
  <h1>Activités scientifiques</h1>
  <div class="subtitle">Moteur V0 — corpus de 654 ressources</div>
</header>
<main>
  <div class="search">
    <input id="q" placeholder="Que cherchez-vous ?  ex. oiseaux forêt, eau, électricité, insectes…">
    <button id="reset">Réinitialiser</button>
  </div>
  <div class="layout">
    <aside class="panel filters">
      <strong>Filtres</strong>
      <label>Âge minimum</label><input id="ageMin" type="number" min="6" max="14" placeholder="6">
      <label>Âge maximum</label><input id="ageMax" type="number" min="6" max="14" placeholder="14">
      <label>Durée maximale (min)</label><input id="duration" type="number" min="0" placeholder="sans limite">
      <label>Activité physique</label>
      <select id="physical"><option value="">Indifférent</option><option>Oui</option><option>Non</option></select>
      <label>Domaine</label><select id="domain"><option value="">Tous</option></select>
      <label>Source</label><select id="source"><option value="">Toutes</option></select>
      <div class="small">Les informations absentes ne sont pas inventées.</div>
    </aside>
    <section>
      <div class="results-head"><span id="count"></span><span>Recherche textuelle + filtres explicites</span></div>
      <div id="results"></div>
    </section>
  </div>
</main>

const $ = id => document.getElementById(id);

function vals(field) {
  const s = new Set();
  DATA.forEach(r => String(r[field]||"").split(/[;,]/).forEach(x => { x=x.trim(); if(x) s.add(x); }));
  return [...s].sort((a,b)=>a.localeCompare(b,'fr'));
}
function populate(id, field) {
  vals(field).forEach(v => {
    const o=document.createElement('option'); o.value=v; o.textContent=v; $(id).appendChild(o);
  });
}
populate('domain','domaine');
populate('source','source');

function haystack(r) {
  return ['titre','source','domaine','theme','materiel','format','actions_enfants','contexte']
    .map(k=>String(r[k]||'').toLowerCase()).join(' ');
}
function match(r) {
  const q=$('q').value.trim().toLowerCase();
  if(q && !q.split(/\s+/).every(t=>haystack(r).includes(t))) return false;
  const amin=Number($('ageMin').value), amax=Number($('ageMax').value);
  const rmin=Number(r.age_min), rmax=Number(r.age_max);
  if($('ageMin').value && r.age_min!=='' && rmax < amin) return false;
  if($('ageMax').value && r.age_max!=='' && rmin > amax) return false;
  const dur=Number($('duration').value);
  if(dur && r.duree_min!=='' && Number(r.duree_min)>dur) return false;
  if($('physical').value && String(r.activite_physique||'').toLowerCase() !== $('physical').value.toLowerCase()) return false;
  if($('domain').value && !String(r.domaine||'').toLowerCase().includes($('domain').value.toLowerCase())) return false;
  if($('source').value && r.source!==$('source').value) return false;
  return true;
}
function esc(s) { return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function render() {
  const rows=DATA.filter(match);
  $('count').textContent=rows.length+' résultat'+(rows.length>1?'s':'');
  if(!rows.length) { $('results').innerHTML='<div class="panel empty">Aucun résultat. Essayez une recherche plus large.</div>'; return; }
  $('results').innerHTML=rows.map(r=>{
    const tags=[];
    if(r.age_min!==''&&r.age_max!=='') tags.push(esc(r.age_min)+'–'+esc(r.age_max)+' ans');
    if(r.duree_min!=='') tags.push(esc(r.duree_min)+' min');
    if(r.activite_physique!=='') tags.push('physique : '+esc(r.activite_physique));
    if(r.domaine) tags.push(esc(r.domaine));
    return `<article class="card">
      <h2>${esc(r.titre)}</h2>
      <div class="meta">${esc(r.source)}${r.format?' · '+esc(r.format):''}</div>
      <div class="tags">${tags.map(t=>'<span class="tag">'+t+'</span>').join('')}</div>
      ${r.theme?'<div class="detail"><strong>Thèmes :</strong> '+esc(r.theme)+'</div>':''}
      ${r.materiel?'<div class="detail"><strong>Matériel :</strong> '+esc(r.materiel)+'</div>':''}
      ${r.actions_enfants?'<div class="detail"><strong>Ce que font les enfants :</strong> '+esc(r.actions_enfants)+'</div>':''}
      ${r.url?'<div class="detail" style="margin-top:13px"><a href="'+esc(r.url)+'" target="_blank" rel="noopener">Voir la ressource ↗</a></div>':''}
    </article>`;
  }).join('');
}
['q','ageMin','ageMax','duration','physical','domain','source'].forEach(id=>$(id).addEventListener('input',render));
$('reset').onclick=()=>{ ['q','ageMin','ageMax','duration'].forEach(id=>$(id).value=''); $('physical').value=''; $('domain').value=''; $('source').value=''; render(); };
render();
</script>
